<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="800" height="800">
  <rect width="400" height="400" fill="#faf8f5"/>
  
  <!-- Wrap all elements to scale by 1.25 around the center (200, 200) -->
  <g transform="translate(200, 200) scale(1.25) translate(-200, -200)">
    <!-- Icon mark - stylized gate/torii with book -->
    <g transform="translate(200, 139)">
      <!-- Traditional gate/torii inspired arch -->
      <path d="M -55 12 L -55 -18 Q -55 -36 -36 -42 L 0 -54 L 36 -42 Q 55 -36 55 -18 L 55 12" 
        fill="none" stroke="#c4362a" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Cross beam -->
      <line x1="-62" y1="-6" x2="62" y2="-6" stroke="#c4362a" stroke-width="3.2"/>
      <!-- Pillars -->
      <line x1="-42" y1="-6" x2="-42" y2="30" stroke="#c4362a" stroke-width="3.8"/>
      <line x1="42" y1="-6" x2="42" y2="30" stroke="#c4362a" stroke-width="3.8"/>
      <!-- Gold accent at top -->
      <circle cx="0" cy="-54" r="6" fill="#d4a853"/>
      <!-- Small book/open pages shape inside -->
      <path d="M -15 10 Q 0 3 15 10 M -15 10 L -15 22 Q 0 15 15 22 L 15 10" 
        fill="none" stroke="#d4a853" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Main text: 吉祥 -->
    <text x="200" y="239" 
      font-family="'Noto Serif SC', 'STSong', 'SimSun', 'Songti SC', serif" 
      font-size="64" 
      font-weight="700"
      fill="#c4362a"
      text-anchor="middle"
      letter-spacing="10">吉祥</text>

    <!-- Tagline divider -->
    <line x1="105" y1="257" x2="165" y2="257" stroke="#d4a853" stroke-width="1.2"/>
    <circle cx="200" cy="257" r="3" fill="#d4a853"/>
    <line x1="235" y1="257" x2="295" y2="257" stroke="#d4a853" stroke-width="1.2"/>

    <!-- English company name -->
    <text x="200" y="287" 
      font-family="'Georgia', 'Times New Roman', serif" 
      font-size="16" 
      fill="#8a7a6a"
      text-anchor="middle"
      letter-spacing="4">KISSHO CO., LTD</text>

    <!-- Tagline -->
    <text x="200" y="317" 
      font-family="'Noto Serif SC', 'STSong', 'SimSun', serif" 
      font-size="13" 
      fill="#a09080"
      text-anchor="middle"
      letter-spacing="5">日本国际学校 · 教育咨询</text>
  </g>
</svg>